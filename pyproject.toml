[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learnguard"
version = "0.1.0"
description = "LearnGuard module scaffold"
requires-python = ">=3.10"

dependencies = [
    "pandas>=3.1",
    "pyarrow>=23.0",
]

[project.optional-dependencies]
dev = [
    "matplotlib>=3.11",
    "ipykernel>=7.4",
    "nbformat>=5.11",
    "nbclient>=0.11",
    "jupyterlab>=4.6",
    "pytest>=9",
]

[project.scripts]
learnguard = "learnguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
